<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viktoria kuzovina — graphic designer</title>
<meta name="description" content="Портфолио графического дизайнера Виктории Кузовиной (viquzy): брендинг, контент, мерч, арт-дирекшн, перформанс, ИИ.">
<meta property="og:type" content="website">
<meta property="og:title" content="viktoria kuzovina — graphic designer">
<meta property="og:description" content="Портфолио: брендинг, контент, мерч, арт-дирекшн, перформанс, ИИ.">
<meta name="theme-color" content="#f5f5f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   КАК УСТРОЕНО: СЕТКА КАК ИНТЕРФЕЙС

   8 колонок (макет 1200: поля 50, колонка 128.75, промежуток 10).
   Каждый проект — полоса шириной ровно в 2 колонки.

     главная     4 полосы × 2 колонки; при наведении полоса растёт до 3 колонок
                 и в ней проступает работа
     проект      открытый проект встаёт в колонки 1–6, остальные сжимаются
                 в тонкие полосы в колонках 7–8
     me          так же, только слева текст обо мне

   На телефоне (уже 700px) полосы становятся строками и раскрываются вниз.
   Проекты описаны в массиве PROJECTS внизу файла.
   ========================================================================== */

:root {
  --ink: #323232;
  --paper: #f5f5f5;
  --grid-color: transparent;          /* сетка скрыта; вернуть — поставь #e5ebf4 */             /* голубая сетка; убрать — поставь transparent */
  --ease: cubic-bezier(.65, 0, .25, 1);
  --ls: .012em;                      /* межбуквенный интервал: добавка ко всем текстам (≈ +10%) */
  --line-gray: #949494;              /* серый, как светло-серый текст */
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', Arial, sans-serif;
  font-synthesis: none;
  text-transform: lowercase;
  -webkit-font-smoothing: antialiased;
  container-type: inline-size;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-transform: inherit; text-align: inherit; }
h1, h2, h3, p, ul, ol { font: inherit; padding: 0; list-style: none; }

/* --- единицы и сетка ------------------------------------------------------ */

.page {
  --u: calc(100vw / 1200);
  --f-name: 33; --f-big: 50.6; --f-text: 22; --f-desc: 15; --f-small: 16.5;   /* размеры текста (+10%) */
  --gm: 50; --gc: 128.75; --gp: 138.75; --gw: 1100;
  --c2: calc(267.5 * var(--u));      /* 2 колонки */
  --c3: calc(406.25 * var(--u));     /* 3 колонки */
  --c1: calc(128.75 * var(--u));     /* 1 колонка */
  --c4: calc(545 * var(--u));        /* 4 колонки */
  --c5: calc(683.75 * var(--u));     /* 5 колонок */
  --gap: calc(10 * var(--u));
  --rule: calc(2 * var(--u));   /* толщина чёрных линий */
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background: var(--paper);
}
@supports (width: 1cqw) { .page { --u: calc(100cqw / 1200); } }

.page::before {
  --lw: max(1px, calc(1.6 * var(--u)));
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: calc(var(--gm) * var(--u));
  width: calc(var(--gw) * var(--u));
  background:
    linear-gradient(to right,
      var(--grid-color) var(--lw), transparent var(--lw),
      transparent calc(var(--gc) * var(--u) - var(--lw)), var(--grid-color) calc(var(--gc) * var(--u) - var(--lw)),
      var(--grid-color) calc(var(--gc) * var(--u)), transparent calc(var(--gc) * var(--u)))
    0 0 / calc(var(--gp) * var(--u)) 100% repeat-x;
  pointer-events: none;
  z-index: -1;
}
/* на компьютере линии сетки 5–12 (колонки 3–6, где блокнот и проекты) скрыты */
@media (min-width: 700px) {
  .page::before {
    -webkit-mask-image: linear-gradient(to right, #000 calc(272 * var(--u)), transparent calc(272 * var(--u)) calc(827 * var(--u)), #000 calc(827 * var(--u)));
            mask-image: linear-gradient(to right, #000 calc(272 * var(--u)), transparent calc(272 * var(--u)) calc(827 * var(--u)), #000 calc(827 * var(--u)));
  }
}

/* --- типографика ---------------------------------------------------------- */

.t-name, .t-head, .t-lead, .t-mute, .t-small, .t-desc { letter-spacing: calc(-0.8 * var(--u) + var(--ls)); }
.t-name  { font-size: calc(var(--f-name) * var(--u)); font-weight: 600; line-height: 1; }
.t-head  { font-size: calc(var(--f-text) * var(--u)); font-weight: 600; line-height: 1.1; }
.t-lead  { font-size: calc(var(--f-text) * var(--u)); font-weight: 500; line-height: 1.1; }
.t-mute  { font-size: calc(var(--f-text) * var(--u)); font-weight: 400; line-height: 1.1; opacity: .5; }
.t-small { font-size: calc(var(--f-small) * var(--u)); font-weight: 400; line-height: 1; letter-spacing: calc(-0.5 * var(--u) + var(--ls)); font-variant-numeric: tabular-nums; }
.t-desc  { font-size: calc(var(--f-desc) * var(--u)); line-height: 1.25; }
.t-desc .lead { font-weight: 500; }
.t-desc .mute { font-weight: 400; opacity: .5; }
.t-desc p + p { margin-top: .9em; }
.t-desc a { text-decoration: underline; text-decoration-thickness: from-font; text-underline-offset: .12em; }
.t-desc a:hover { opacity: .5; }

/* --- шапка ---------------------------------------------------------------- */

.logo { position: absolute; top: calc(23 * var(--u)); left: calc(50 * var(--u)); display: flex; align-items: flex-start; }
.logo .sup { font-size: calc(var(--f-text) * var(--u)); font-weight: 500; opacity: .5; margin: calc(-8 * var(--u)) 0 0 calc(1 * var(--u)); letter-spacing: calc(-0.8 * var(--u) + var(--ls)); }
.logo a:hover { opacity: .5; }
.girl { position: absolute; left: calc(1050 * var(--u)); top: calc(-2.6 * var(--u)); width: calc(50 * var(--u)); }   /* девочка — в правом углу, по правому краю сетки */
.girl svg { display: block; width: 100%; height: auto; color: #000; }
/* подмигивание: правый глаз на миг закрывается (рисунок из твоего SVG) */
.girl .eye-wink { opacity: 0; }
.girl:hover .eye-open { animation: eye-open .7s steps(1, end) both; }
.girl:hover .eye-wink { animation: eye-wink .7s steps(1, end) both; }
@keyframes eye-open { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes eye-wink { 0% { opacity: 1; } 100% { opacity: 0; } }
/* белый/серый фон картинок растворяется, сетка проходит сквозь */
.logo__gif, .me__gif, .strip__icon, .strip__img, .body__side .icons img, .me__aside img { mix-blend-mode: multiply; }

.nav { position: absolute; top: calc(30.6 * var(--u)); left: var(--nav-x, calc(882.5 * var(--u))); width: calc(1150 * var(--u) - var(--nav-x, calc(882.5 * var(--u)))); transition: left .7s var(--ease), width .7s var(--ease); display: flex; justify-content: space-between; }
.nav a { position: relative; }
.nav a::after { content: ''; position: absolute; inset: -12px; }
.nav a:hover { opacity: .5; }
.projects-label { display: none; }
.page.view-me { --nav-x: calc(882.5 * var(--u)); }
.page.view-project { --nav-x: calc(882.5 * var(--u)); }

/* --- полосы --------------------------------------------------------------- */

.strips {
  position: absolute;
  left: calc(50 * var(--u));
  width: calc(1100 * var(--u));
  top: calc(90 * var(--u));
  bottom: calc(60 * var(--u));
  display: flex;
  gap: var(--gap);
}
.strip {
  position: relative;
  flex: 0 0 var(--c2);
  min-width: 0;
  transition: flex-basis .7s var(--ease);
}
.strip--me { flex-basis: 0; margin-right: calc(-1 * var(--gap)); }

/* главная: наведённая полоса растёт до 3 колонок, остальные уступают место */
.strips.is-home:has(.strip:hover) .strip:not(.strip--me) { flex-basis: calc((1100 * var(--u) - var(--c3) - 3 * var(--gap)) / 3); }
.strips.is-home:has(.strip:hover) .strip:not(.strip--me):hover { flex-basis: var(--c3); }

/* каждый проект справа — ровно одна колонка сетки:
   me      — колонки 1–4, проекты в колонках 5–8
   проект  — колонки 1–5, остальные три в колонках 6–8 */
.strips.has-open .strip:not(.strip--me) { flex-basis: calc((var(--c2) - 2 * var(--gap)) / 3); }   /* меню — в колонках 7–8 */
.strips.me-open .strip { flex-basis: calc((var(--c2) - 3 * var(--gap)) / 4); }
.strips.me-open .strip.is-open { flex-basis: calc(822.5 * var(--u)); order: -1; margin-right: 0; --cols: 6; }
.strips.has-open .strip.is-open { flex-basis: calc(822.5 * var(--u)); order: -1; --cols: 6; }   /* проект — колонки 1–6 */

/* лицевая сторона полосы */
.strip__face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  border-top: var(--rule) solid var(--line-gray);
  padding-top: calc(12 * var(--u));
  overflow: hidden;
  transition: background-color .25s, color .25s;
}
.strip__top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--gap); white-space: nowrap; }
.strip__titlebox { position: relative; flex: 1; min-height: 0; margin: calc(20 * var(--u)) 0; }
.strip__title {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: calc(var(--f-big) * var(--u));
  font-weight: 600;
  line-height: .95;
  letter-spacing: calc(-.035em + var(--ls));
  transition: opacity .3s, font-size .5s var(--ease);
}
.strip__kind { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .3s; }
/* иконка проекта: ровно 1 колонка сетки, во второй колонке полосы, над подписью */
.strip__icon {
  position: absolute;
  right: 0; bottom: calc(40 * var(--u));
  width: calc(128.75 * var(--u)); height: auto;
  transition: opacity .3s, width .7s var(--ease), bottom .7s var(--ease);
}
.strips.is-home .strip__face:hover .strip__icon,
.strips.is-home .strip__face:focus-visible .strip__icon { opacity: 0; }
/* в тонкой полосе иконка становится меткой внизу */
.strips.has-open .strip__icon, .strips.me-open .strip__icon {
  left: calc(6 * var(--u)); right: auto; bottom: 0;
  width: calc(50% - 6 * var(--u)); height: auto;
  transition: width .4s var(--ease), filter .3s ease, opacity .3s ease;
}
.strips.has-open .strip__face:hover .strip__icon, .strips.has-open .strip.is-hot .strip__icon { width: calc(100% - 12 * var(--u)); }
.strips.has-open .strip:not(.is-open) .strip__icon { width: calc(100% - 12 * var(--u)); }
.strips.me-open .strip__icon { left: 0; width: 100%; }   /* на главной иконки как были */
/* на главной: иконка проекта внизу полосы, название над ней */
.strips.me-open .strip__titlebox { margin-bottom: calc((var(--c2) - 3 * var(--gap)) / 4 + 20 * var(--u)); }
.strips.me-open .strip__face:hover .strip__icon, .strips.me-open .strip.is-hot .strip__icon,
.strips.has-open .strip__face:hover .strip__icon { mix-blend-mode: normal; }
.strips.has-open .strip__titlebox { margin-bottom: calc(var(--c1) + 20 * var(--u)); }
.page .strips.has-open .strip:not(.is-open) .strip__num { opacity: .5; transition: opacity .3s ease; }
.page .strips.has-open .strip:not(.is-open) .strip__face:hover .strip__num,
.page .strips.has-open .strip.is-hot:not(.is-open) .strip__num { opacity: 1; }
.side__title { margin: 0; letter-spacing: calc(-0.8 * var(--u) + var(--ls)); }
/* «читать лонгрид»: тёмная плашка, как подвал; при наведении — светлая с чёрной рамкой */
.t-desc a.read-bar {
  display: flex; justify-content: flex-start; align-items: center;
  margin: calc(24 * var(--u)) 0;
  padding: calc(12 * var(--u)) calc(12 * var(--u));
  background: var(--ink); color: var(--paper);
  border: var(--rule) solid var(--ink);
  font-weight: 600; text-decoration: none;
  transition: background-color .25s ease, color .25s ease;
}
.read-bar__arrow { display: inline-flex; transition: transform .3s var(--ease); }
.read-bar__arrow .chev { width: .9em; height: .75em; display: block; }
.read-bar--end { display: none !important; }
@media (max-width: 699px) {
  .body__side .read-bar { display: none !important; }
  .body__flow a.read-bar--end {
    display: flex !important; grid-column: 1 / -1; justify-content: space-between; align-items: center;
    margin-top: calc(10 * var(--u)); padding: calc(12 * var(--u)); background: var(--ink); color: var(--paper);
    border: var(--rule) solid var(--ink); font-size: calc(var(--f-desc) * var(--u)); font-weight: 600; text-decoration: none;
  }
}
.t-desc a.read-bar:hover { opacity: 1; background: transparent; color: var(--ink); }
.read-bar:hover .read-bar__arrow { transform: translateX(calc(4 * var(--u))); }
.side__top { display: flex; justify-content: space-between; align-items: flex-start; }
.side__top .icons { margin-bottom: calc(30 * var(--u)); }
.side__close { grid-column: auto; grid-row: auto; margin-top: calc(-4 * var(--u)); }
.body__side .side__date { margin: calc(8 * var(--u)) 0 calc(28 * var(--u)); }
.body__num:empty { display: none; }
/* анимированные иконки (гифки) в меню показывают первый кадр, а двигаются при наведении */
.strip__anim { visibility: hidden; }
.strip:not(.is-open) .strip__face:hover .strip__anim, .strip.is-hot:not(.is-open) .strip__anim { visibility: visible; }
.strip:not(.is-open) .strip__face:hover .strip__still, .strip.is-hot:not(.is-open) .strip__still { visibility: hidden; }
/* у открытого проекта лицевая сторона полосы (иконки, гифка) полностью скрыта */
.strip.is-open .strip__face, .strip.is-open .strip__face * { visibility: hidden !important; }
/* в открытом проекте меню справа приглушено: иконки чёрно-белые и прозрачные, названия серые;
   при наведении полоса оживает */
.page .strips.has-open .strip:not(.is-open) .strip__icon { filter: grayscale(1); opacity: .35; transition: filter .3s ease, opacity .3s ease; }
.page .strips.has-open .strip:not(.is-open) .strip__title { color: var(--line-gray); transition: color .3s ease; }
.page .strips.has-open .strip:not(.is-open) .strip__face:hover,
.page .strips.has-open .strip.is-hot:not(.is-open) .strip__face { background: none; color: var(--ink); }
.page .strips.has-open .strip:not(.is-open) .strip__face:hover .strip__icon,
.page .strips.has-open .strip.is-hot:not(.is-open) .strip__icon { filter: none; opacity: 1; }
.page .strips.has-open .strip:not(.is-open) .strip__face:hover .strip__title,
.page .strips.has-open .strip.is-hot:not(.is-open) .strip__title { color: var(--ink); }
.strip__img {
  position: absolute;
  left: 0; right: 0;
  top: calc(50 * var(--u)); bottom: calc(40 * var(--u));
  width: 100%; height: calc(100% - 90 * var(--u));
  object-fit: contain;
  object-position: center;
  opacity: 0;
  transform: translateY(calc(16 * var(--u)));
  transition: opacity .45s ease, transform .6s var(--ease);
  pointer-events: none;
}
.strips.is-home .strip__face:hover .strip__img,
.strips.is-home .strip__face:focus-visible .strip__img { opacity: 1; transform: none; }
.strips.is-home .strip__face:hover .strip__title,
.strips.is-home .strip__face:focus-visible .strip__title { opacity: 0; }

/* тонкие полосы справа */
.strips.has-open .strip__face, .strips.me-open .strip__face { padding-left: calc(6 * var(--u)); padding-right: calc(6 * var(--u)); }
.strips.has-open .strip__title, .strips.me-open .strip__title { font-size: calc(var(--f-text) * var(--u)); }
.strips.has-open .strip__kind, .strips.me-open .strip__kind,
.strips.has-open .strip__year, .strips.me-open .strip__year { opacity: 0; }
.strips.has-open .strip:not(.is-open) .strip__face:hover,
.strips.me-open .strip:not(.is-open) .strip__face:hover,
.strips.me-open .strip.is-hot .strip__face { background: var(--ink); color: var(--paper); }
.strip.is-open .strip__face { visibility: hidden; }

/* открытая полоса */
.strip__body {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  overscroll-behavior: contain;
  opacity: 0;
  visibility: hidden;
  transition: opacity .4s ease .35s, visibility 0s linear .75s;
}
.strip__body::-webkit-scrollbar { display: none; }
.strip.is-open .strip__body { opacity: 1; visibility: visible; transition: none; animation: body-in .45s ease both; }
@keyframes body-in { from { opacity: 0; } to { opacity: 1; } }
/* при переключении раскладка меняется мгновенно (без растягивания полос и иконок),
   а содержимое просто проявляется — так нет рывков на тяжёлых картинках и гифках */
.strips.no-anim .strip, .strips.no-anim .strip__body, .strips.no-anim .strip__icon,
.strips.no-anim .strip__title, .strips.no-anim .strip__face { transition: none !important; }
.strip:not(.is-open) .strip__body { animation: none; }

.body__head {
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), calc(128.75 * var(--u)));
  column-gap: var(--gap);
  align-items: start;
  border-top: var(--rule) solid var(--ink);
  padding: calc(12 * var(--u)) 0 calc(18 * var(--u));
}
.body__num { grid-column: 1; }
.strip__num, .body__num, .num { opacity: .5; font-style: italic; font-weight: 600; }   /* номера серые, как серый текст */
.body__title { grid-column: 1 / span 2; grid-row: 2; margin-top: calc(40 * var(--u)); letter-spacing: calc(-0.8 * var(--u) + var(--ls)); }
.body__title:empty { display: none; }
.body__close { grid-column: -2 / -1; grid-row: 1; justify-self: end; font-size: calc(28 * var(--u)); line-height: .6; font-weight: 400; }
@media (min-width: 700px) {
  .strip:not(.strip--me) .strip__body { overflow: hidden; display: flex; flex-direction: column; }
  .strip:not(.strip--me) .body__grid { flex: 1; min-height: 0; overflow: hidden; grid-template-rows: 100%; padding-bottom: 0; }
  .strip:not(.strip--me) .body__side { position: static; max-height: 100%; overflow-y: auto; scrollbar-width: none; padding-bottom: calc(20 * var(--u)); }
  .strip:not(.strip--me) .body__flow { height: 100%; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; padding-bottom: calc(40 * var(--u)); align-content: start;
  }
  /* картинки начинаются сразу от чёрной линии и уходят под неё при прокрутке */
  .strip:not(.strip--me) .body__head { padding: 0; }
  .strip:not(.strip--me) .body__grid { padding-top: 0; }
  .strip:not(.strip--me) .body__side { padding-top: calc(24 * var(--u)); }
  .strip:not(.strip--me) .body__side::-webkit-scrollbar, .strip:not(.strip--me) .body__flow::-webkit-scrollbar { display: none; }
}
.body__close:hover, .body__next:hover { opacity: .5; }

.body__grid {
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), calc(128.75 * var(--u)));
  column-gap: var(--gap);
  align-items: start;
  padding: calc(24 * var(--u)) 0 calc(80 * var(--u));
}
.body__side { grid-column: 1 / span 2; position: sticky; top: calc(24 * var(--u)); }
.body__side .meta { margin-top: calc(24 * var(--u)); }
.body__side .icons { display: grid; grid-template-columns: calc(64.375 * var(--u)); gap: var(--gap); margin-bottom: calc(30 * var(--u)); }
.body__flow {
  grid-column: 3 / span 4;
  display: grid;
  grid-template-columns: repeat(4, calc(128.75 * var(--u)));
  column-gap: var(--gap);
  row-gap: var(--gap);
  align-items: start;
}
.body__flow img { width: 100%; grid-column: 1 / -1; }
.body__next { grid-column: 1 / -1; border-top: var(--rule) solid var(--line-gray); padding-top: calc(12 * var(--u)); text-align: left; }

/* me */
.stage {
  grid-column: 3 / span 4;
  grid-row: 1 / span 2;
  position: relative;
  height: max(calc(100vh - 250 * var(--u)), calc(440 * var(--u)));
  margin-top: calc(-30 * var(--u));
}
.stage .me__gif {
  position: absolute;
  left: 50%; top: 50%;
  height: min(100%, calc(535 * var(--u)));
  width: auto;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  transform: translate(-50%, -50%);
  z-index: 1;
}
.floater {
  position: absolute;
  left: var(--l); top: var(--t);
  width: calc(var(--size, 118) * var(--u));
  z-index: 2;
  animation: float var(--dur, 7s) ease-in-out infinite alternate;
  animation-delay: var(--delay, 0s);
}
/* картинка задаёт размер, а показывается холст с пикселизацией поверх неё */
.floater img { display: block; width: 100%; visibility: hidden; }
.floater canvas {
  position: absolute;
  left: 0; top: 0; width: 100%; height: 100%;
  mix-blend-mode: multiply;
  image-rendering: pixelated;
  transition: transform .4s ease;
}
.floater__label {
  position: absolute;
  left: 0; top: 100%;
  padding-top: calc(8 * var(--u));
  white-space: nowrap;
  opacity: 0;
  transition: opacity .3s;
}
.floater--right .floater__label { left: auto; right: 0; }
.floater:hover, .floater:focus-visible, .floater.is-hot { animation-play-state: paused; z-index: 3; }
.floater:hover canvas, .floater:focus-visible canvas, .floater.is-hot canvas { transform: scale(1.06); }
.floater:hover .floater__label, .floater:focus-visible .floater__label, .floater.is-hot .floater__label { opacity: 1; }
@keyframes float {
  from { transform: translate(0, 0) rotate(-2deg); }
  to   { transform: translate(calc(12 * var(--u)), calc(-16 * var(--u))) rotate(2deg); }
}
.body__side .col2 { margin-left: calc(138.75 * var(--u)); }
/* направления — в два столбика по сетке */
.dirs { display: grid; grid-template-columns: repeat(2, calc(128.75 * var(--u))); column-gap: var(--gap); }
.dirs p { margin: 0 !important; }
.keep-case { text-transform: none; }
/* главная, компьютер: текст о себе сразу под направлениями, alumni и контакт — внизу */
@media (min-width: 700px) {
  .strip--me .body__side { justify-content: flex-start !important; }
  .strip--me .me__text { display: contents; }
  .strip--me .me__text > p.lead { margin-top: calc(48 * var(--u)) !important; }
  .strip--me .me__foot { margin-top: auto !important; }
}
/* последняя строка «обо мне»: alumni и контакт — два столбика по сетке */
.me__foot { display: grid; grid-template-columns: repeat(2, calc(128.75 * var(--u))); column-gap: var(--gap); align-items: last baseline; margin-top: .9em; }
.me__foot p { margin: 0 !important; }
.tg-link { display: inline-flex; align-items: center; gap: .3em; color: var(--ink); text-decoration: none; }
.tg-link:hover { opacity: .5; }
.tg { width: 1em; height: 1em; flex: none; }
@media (max-width: 699px) {
  .me__foot { grid-template-columns: 1fr calc(116 * var(--u)); }   /* правый столбик ближе к краю */
  .page { --rule: calc(1.6 * var(--u)); }                       /* линии на телефоне на 20% тоньше */
  .strip--me .body__head { padding: 0; }
  .strip--me .body__grid { padding-top: calc(16 * var(--u)) !important; }
  .strip--me .body__side { display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
  .strip--me .body__side > *, .strip--me .me__text > p { margin: 0 !important; }
  .strip--me .me__text { display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
  .strip--me .stage { margin-top: 0 !important; }
  .body__side .side__date { margin: calc(4 * var(--u)) 0 calc(14 * var(--u)) !important; }
  .strip:not(.strip--me) .body__grid { padding-top: calc(8 * var(--u)) !important; }
  .strip--me .me__foot { margin-top: 0; }
}
@media (min-width: 700px) { .strip--me .dirs { margin-top: calc(-42 * var(--u)); } }   /* на одной линии с номерами 01–04 */
.me__aside { grid-column: 3 / span 2; grid-row: 2; display: grid; grid-template-columns: repeat(2, calc(128.75 * var(--u))); column-gap: var(--gap); align-items: start; margin-top: calc(30 * var(--u)); }
.me__aside img { width: 100%; }
.strip--me .body__side { grid-row: 1 / span 2; }

/* --- подвал: тёмная плашка ------------------------------------------------ */

.bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: calc(40 * var(--u));
  background: var(--ink);
  font-weight: 500;
  color: var(--paper);
}
.bar__open { position: absolute; left: calc(50 * var(--u)); top: 50%; transform: translateY(-50%); white-space: nowrap; }
.bar__links { position: absolute; left: calc(882.5 * var(--u)); width: var(--c2); top: 50%; transform: translateY(-50%); display: flex; justify-content: space-between; }
.bar__links a:hover { opacity: .5; }

a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.bar a:focus-visible { outline-color: var(--paper); }

/* ==========================================================================
   ТЕЛЕФОН: полосы становятся строками и раскрываются вниз
   ========================================================================== */

@media (max-width: 699px) {
  .page {
    --u: calc(100vw / 320);
    --f-name: 16.5; --f-big: 16.5; --f-text: 12; --f-desc: 12; --f-small: 10;
    --gm: 10; --gc: 60; --gp: 80; --gw: 300;
    --gap: calc(20 * var(--u));
    position: relative;
    inset: auto;
    min-height: 100vh;
    overflow: visible;
    display: flex;
    flex-direction: column;
  }
  .page > header { position: relative; }
  @supports (width: 1cqw) { .page { --u: calc(100cqw / 320); } }
  .page::before { position: fixed; }

  .logo { position: static; padding: calc(15 * var(--u)) calc(10 * var(--u)) 0; }
  .nav { top: calc(19 * var(--u)); left: auto; right: calc(10 * var(--u)); width: auto; gap: calc(14 * var(--u)); }

  .strips { position: static; width: auto; display: flex; flex-direction: column; margin: calc(12 * var(--u)) calc(10 * var(--u)) calc(40 * var(--u)); }
  .strips .strip.is-open { order: -1; }
  .page .strips .strip { flex: none !important; width: 100%; }                       /* открытый проект — первым, остальные строками под ним */
  .strip, .strips .strip { margin: 0; }
  .strip--me { display: none; }
  .nav__label { display: none; }
  .projects-label { display: block; margin: calc(30 * var(--u)) 0 calc(10 * var(--u)); }
  .strip--me.is-open { display: block; }
  .strip:last-child { border-bottom: var(--rule) solid var(--line-gray); }

  .strip__face {
    position: relative;
    display: grid;
    grid-template-columns: calc(30 * var(--u)) 1fr auto;
    width: 100%;
    column-gap: calc(10 * var(--u));
    align-items: baseline;
    height: calc(52 * var(--u));
    padding: 0;
    align-content: center;
    border-top: var(--rule) solid var(--line-gray);
  }
  .strip__top { display: contents; }
  .strip__num { grid-column: 1; grid-row: 1; }
  .strip__year { grid-column: 3; grid-row: 1; }
  .strip__titlebox { grid-column: 2; grid-row: 1; margin: 0; min-width: 0; }
  .strip__title { position: static; writing-mode: horizontal-tb; transform: none; font-size: calc(var(--f-big) * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .strip__kind, .strip__img, .strip__icon { display: none; }
  .strips.me-open .strip__titlebox { margin: 0; }
  .strips.me-open .strip__icon { display: none; }
  .girl { position: relative; left: auto; top: auto; width: calc(28 * var(--u)); margin: calc(-4 * var(--u)) 0 0 auto; }
  .body__side .icons { grid-template-columns: calc(40 * var(--u)); }
  .strips.has-open .strip__title, .strips.me-open .strip__title { font-size: calc(var(--f-big) * var(--u)); }
  .strips.has-open .strip__year, .strips.me-open .strip__year { opacity: 1; }
  .strip.is-open .strip__face { display: none; }

  .strip__body { position: static; overflow: visible; display: none; opacity: 1; visibility: visible; }
  .strip.is-open .strip__body { display: block; }
  .body__head, .body__grid, .body__flow { grid-template-columns: repeat(4, calc(60 * var(--u))); }
  .body__head { padding: calc(14 * var(--u)) 0; top: 0; }
  .body__title { grid-column: 1 / -1; margin-top: calc(16 * var(--u)); }
  .body__close { grid-column: 4; justify-self: end; }
  .body__side { grid-column: 1 / -1; position: static; margin-bottom: calc(30 * var(--u)); }
  .body__flow { grid-column: 1 / -1; row-gap: calc(10 * var(--u)); }
  .body__flow img { grid-column: 1 / -1; }
  .me__aside { grid-column: 1 / -1; grid-row: auto; grid-template-columns: repeat(2, 1fr); margin: 0 0 calc(30 * var(--u)); }
  .me__aside img { width: calc(60 * var(--u)); }
  .body__side .col2 { margin-left: calc(80 * var(--u)); }
  .stage { grid-column: 1 / -1; grid-row: auto; height: calc(320 * var(--u)); }
  .stage .me__gif { height: calc(280 * var(--u)); }
  .floater { width: calc(70 * var(--u)); }

  .strip--me .body__side { grid-row: auto; }

  .bar { position: static; margin-top: auto; height: auto; padding: calc(12 * var(--u)) calc(10 * var(--u)); display: flex; flex-direction: column; gap: calc(8 * var(--u)); }
  .bar__open, .bar__links { position: static; transform: none; width: auto; }
  .bar__links { justify-content: flex-start; gap: calc(14 * var(--u)); }
}



/* ---- главная (me) ---- */
.body__label { grid-column: 2; grid-row: 1; opacity: .5; }
.strip__num { opacity: 1; font-style: normal; font-weight: 400; }   /* номера проектов справа — как раньше */
@media (min-width: 700px) {
  /* без прокрутки: так Safari растворяет фон блокнота и сетка проходит сквозь него */
  .strip--me .strip__body { overflow: visible; display: flex; flex-direction: column; }
  .strip--me .body__grid { flex: 1; min-height: 0; grid-template-rows: 1fr; align-items: stretch; padding: calc(24 * var(--u)) 0 0; }
  .strip--me .body__side { margin-bottom: calc(-4 * var(--u)); }   /* базовая линия «alumni 2026» = низ иконок справа */
  .strip--me .body__side { grid-row: 1; position: static; display: flex; flex-direction: column; justify-content: space-between; }
  .strip--me .stage { grid-row: 1; height: auto; margin-top: 0; }
}

/* ==========================================================================
   3D-БЛОКНОТ: собран из твоих картинок — обложка, полоска фото, буклет вшэ.
   Все размеры — в пикселях исходной картинки (751 × 1471), умноженных на --k.

.nb-wrap {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transition: transform .9s var(--ease);
}
.nb {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transform-origin: calc(311.5 * var(--k)) 50%;
  animation: nb-spin 16s linear infinite;
  will-change: transform;
}
@keyframes nb-spin {
  from { transform: rotateX(-7deg) rotateY(0deg); }
  to   { transform: rotateX(-7deg) rotateY(360deg); }
}
.nb .f {
  position: absolute;
  left: calc(var(--x) * var(--k)); top: calc(var(--y) * var(--k));
  width: calc(var(--w) * var(--k)); height: calc(var(--h) * var(--k));
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background-size: 100% 100%;
}
/* обложка открывается вокруг корешка; изнутри — левая страница разворота */
.nb-cover {
  position: absolute;
  left: 0; top: calc(524 * var(--k));
  width: calc(623 * var(--k)); height: calc(947 * var(--k));
  transform-style: preserve-3d;
  transform-origin: 0 50%;
  transform: translateZ(calc(96 * var(--k))) rotateY(0deg);
  transition: transform 1.05s var(--ease);
  will-change: transform;
}
.nb-front { --x: 0; --y: 0; --w: 623; --h: 947; background-image: var(--img-cover); box-shadow: inset calc(5 * var(--k)) 0 0 #141414; }
.nb-inner { --x: 0; --y: 0; --w: 623; --h: 947; transform: rotateY(180deg);
            background-image: linear-gradient(to left, rgba(0,0,0,.09), rgba(0,0,0,0) 14%), var(--img-pl);
            box-shadow: inset 0 0 0 max(1px, calc(2 * var(--k))) rgba(0,0,0,.08); }
/* правая страница под обложкой */
.nb-page  { --x: 0; --y: 524; --w: 586; --h: 947; transform: translateZ(calc(90 * var(--k)));
            background-image: linear-gradient(to right, rgba(0,0,0,.08), rgba(0,0,0,0) 12%), var(--img-pr); }
.nb .nb-back { --x: 0; --y: 524; --w: 623; --h: 947; background: var(--img-window) no-repeat calc(146 * var(--k)) calc(207 * var(--k)) / calc(325 * var(--k)) calc(497 * var(--k)), #141414; border-radius: calc(30 * var(--k)) 0 0 calc(30 * var(--k));
            transform: rotateY(180deg) translateZ(calc(96 * var(--k))); }
/* корешок, обрез страниц, верх и низ */
.nb-spine { --x: -96; --y: 524; --w: 192; --h: 947; background: #0d0d0d; transform: rotateY(-90deg); }
.nb-edge  { --x: 527; --y: 540; --w: 192; --h: 915; transform: rotateY(90deg);
            background: linear-gradient(to right, #111 0 5%, transparent 5% 95%, #111 95%),
                        repeating-linear-gradient(to right, #efe4cf 0 calc(5 * var(--k)), #d6c7ab calc(5 * var(--k)) calc(6.5 * var(--k))); }
.nb-top, .nb-bottom { --x: 0; --w: 600; --h: 192;
            background: linear-gradient(to bottom, #111 0 5%, transparent 5% 95%, #111 95%),
                        linear-gradient(to right, #0d0d0d 0 3%, transparent 3%),
                        repeating-linear-gradient(to bottom, #efe4cf 0 calc(5 * var(--k)), #d6c7ab calc(5 * var(--k)) calc(6.5 * var(--k))); }
.nb-top    { --y: 428;  transform: rotateX(90deg); }
.nb-bottom { --y: 1375; transform: rotateX(-90deg); }
/* закладка с лицами лежит под обложкой; при раскрытии опускается на страницу.
   буклет вшэ торчит сбоку. сзади у обоих — те же фотографии */
.nb-strip, .nb-strip-back { --x: 6; --y: 1; --w: 340; --h: 1126; transition: transform .95s var(--ease) .15s; will-change: transform; }
.nb-strip      { background-image: var(--img-strip); transform: translateZ(calc(93 * var(--k))) translateY(0); }
.nb-strip-back { background-image: var(--img-strip); transform: translateZ(calc(93 * var(--k))) translateY(0) rotateY(180deg); }
.nb-book, .nb-book-back { --x: 510; --y: 820; --w: 150; --h: 481; }   /* в покое наполовину спрятана между страниц */   /* бумажка с ником @iamviquzy */
.nb-book       { background-image: var(--img-book); transform: translateZ(calc(22 * var(--k))); }
.nb-book-back  { background-image: var(--img-book); transform: translateZ(calc(22 * var(--k))) rotateY(180deg); }

/* проекты на левой странице: чёрно-белые и бледные, при наведении — в цвете и с названием */
.nb-proj {
  position: absolute;
  left: var(--l); top: var(--t); width: var(--w);
  pointer-events: none;
}
.nb-open .nb-proj { pointer-events: auto; }
.nb-proj img {
  display: block; width: 100%;
  filter: grayscale(1) contrast(.85);
  opacity: .32;
  transition: filter .35s ease, opacity .35s ease, transform .35s ease;
}
.nb-proj__label {
  position: absolute; left: 0; bottom: 100%;
  padding-bottom: calc(10 * var(--k));
  width: max-content; white-space: nowrap;   /* длинное название — в две строки после запятой */
  font-size: calc(30 * var(--k)); line-height: 1.1; font-weight: 600;
  letter-spacing: calc(-.02em + var(--ls)); color: var(--ink);
}
.nb-proj__label, .nb-proj__num { font-style: normal; }
.nb-proj--below .nb-proj__label { bottom: auto; top: 100%; padding: calc(10 * var(--k)) 0 0; }
.nb-proj__num { font-weight: 400; opacity: .5; margin-right: .3em; }
.nb-proj--right .nb-proj__label { left: auto; right: 0; display: flex; flex-direction: row-reverse; align-items: baseline; text-align: right; }
.nb-proj--right .nb-proj__num { margin: 0 0 0 .3em; }
.nb-proj__title { opacity: 0; transition: opacity .3s ease; }
.nb-proj:hover img, .nb-proj:focus-visible img, .nb-proj.is-hot img { filter: none; opacity: 1; transform: scale(1.04); }
.nb-proj:hover .nb-proj__title, .nb-proj:focus-visible .nb-proj__title, .nb-proj.is-hot .nb-proj__title { opacity: 1; }

.nb-mode-contact .nb .nb-strip-back { transform: translateZ(calc(60 * var(--k))) translateY(calc(60 * var(--k))) rotateY(180deg); }

/* бумажка с ником — ссылка на телеграм: покачивается раз в несколько секунд,
   при наведении выдвигается из страниц */
.nb-book { cursor: pointer; transition: transform .35s var(--ease); box-shadow: 0 0 0 max(1px, calc(1.5 * var(--k))) rgba(0,0,0,.12); }
@keyframes nb-wiggle {
  0%, 86%, 100% { transform: translateZ(calc(22 * var(--k))) translateX(0) rotate(0deg); }
  89% { transform: translateZ(calc(22 * var(--k))) translateX(calc(10 * var(--k))) rotate(2deg); }
  92% { transform: translateZ(calc(22 * var(--k))) translateX(calc(4 * var(--k))) rotate(-1.5deg); }
  95% { transform: translateZ(calc(22 * var(--k))) translateX(calc(8 * var(--k))) rotate(1deg); }
}
.nb .nb-book:hover, .nb .nb-book:focus-visible {
  transform: translateZ(calc(22 * var(--k))) translateX(calc(48 * var(--k)));   /* выдвигается, но край остаётся в блокноте */
}
.nb-book:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* наведение на «написать мне» тоже выдвигает бумажку */
.nb .nb-page:has(.nb-write:hover, .nb-write:focus-visible) ~ .nb-book {
  transform: translateZ(calc(22 * var(--k))) translateX(calc(48 * var(--k)));
}
.nb-write { cursor: pointer; }
/* рукописное «написать мне ↓» у правого края разворота — указывает на бумажку */
.nb-write {
  position: absolute; display: none;
  right: 4%; top: 40%;   /* стрелка смотрит на бумажку */
  width: calc(96 * var(--k) * 1.35); height: calc(238 * var(--k) * 1.35);
  background: var(--img-hand) center / contain no-repeat;
}
.nb-open .nb-write { display: block; animation: body-in .5s ease .3s both; }
@media (prefers-reduced-motion: reduce) { .nb-book { animation: none; } }
/* открыто: обложка уходит влево, закладка опускается, разворот встаёт по центру */
.nb-open .nb-wrap   { transform: translate(calc(310 * var(--k)), calc(-170 * var(--k))); }   /* открытый разворот — по центру и чуть выше */
.nb-open .nb-cover  { transform: translateZ(calc(96 * var(--k))) rotateY(-180deg); }
.nb-open .nb-strip      { transform: translateZ(calc(93 * var(--k))) translateY(calc(259 * var(--k))); }
.nb-open .nb-strip-back { transform: translateZ(calc(93 * var(--k))) translateY(calc(259 * var(--k))) rotateY(180deg); }
@media (prefers-reduced-motion: reduce) {
  .nb { animation: none; transform: rotateX(-7deg) rotateY(-28deg); }
}

/* ---- телефон: доработки ---- */
@media (max-width: 699px) {
  /* строки проектов: всегда видны, без смещений от десктопной раскладки */
  .page .strips .strip__titlebox { margin: 0 !important; }
  .page .strips .strip__title { color: var(--ink) !important; font-size: calc(var(--f-big) * var(--u)) !important; }
  .page .strips .strip__num { opacity: .5 !important; }
  .page .strips .strip__icon, .page .strips .strip__still { display: none !important; }
  .page .strips .strip__face:hover { background: none; color: var(--ink); }
  /* главная: отступ между направлениями и текстом, блокнот по центру */
  .strip--me .body__side > .mute:first-child { margin-bottom: calc(20 * var(--u)); }
  .dirs { grid-template-columns: 1fr calc(116 * var(--u)); }
  .strip--me .stage { width: 100%; height: calc(320 * var(--u)) !important; margin: calc(10 * var(--u)) 0 calc(44 * var(--u)) !important; }
  /* проект: без лишнего отступа сверху, картинки во всю ширину */
  .strip:not(.strip--me) .body__head { display: none; }
  .strip:not(.strip--me) .body__grid { padding: calc(16 * var(--u)) 0 calc(10 * var(--u)); }
  .strip:not(.strip--me) .body__flow { padding-bottom: 0 !important; }
  .strip--me .body__grid { padding-bottom: 0; }
  .side__top .icons { margin-bottom: calc(16 * var(--u)); }
  .side__close { font-size: calc(22 * var(--u)) !important; }
  .body__flow { row-gap: calc(8 * var(--u)) !important; }
  .t-desc a.read-bar { padding: calc(10 * var(--u)); }
  /* иконки проектов в раскрытом блокноте сразу в цвете — на телефоне нет наведения */
  .nb-proj img { filter: none; opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .strip, .strip__title, .strip__img, .strip__body, .strip.is-open .strip__body { transition: none; }
}
</style>

      '<div class="strip__body" id="body-' + p.id + '" role="region" aria-label="' + esc(p.title) + '"></div>' +
    '</article>';
  }).join('');

// гифки в меню: рисуем первый кадр на холсте, а саму гифку показываем только при наведении
strips.querySelectorAll('.strip__icon').forEach(function (img) {
  if (!/\.gif(\?|$)/i.test(img.src)) return;
  function still() {
    var cv = document.createElement('canvas');
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    try { cv.getContext('2d').drawImage(img, 0, 0); } catch (e) { return; }
    cv.className = 'strip__icon strip__still';
    cv.setAttribute('aria-hidden', 'true');
    img.parentNode.insertBefore(cv, img.nextSibling);
    img.classList.add('strip__anim');
  }
  img.loading = 'eager';
  if (img.complete && img.naturalWidth) still(); else img.addEventListener('load', still, { once: true });
});

function head(num, title, closable, label) {
  return '<div class="body__head"><span class="body__num t-small">' + num + '</span>' +
    (label ? '<span class="body__label t-small">' + esc(label) + '</span>' : '') +
    '<h2 class="body__title t-name">' + esc(title) + '</h2>' +
    (closable === false ? '' : '<button type="button" class="body__close t-head" data-go="" aria-label="Закрыть, вернуться к me">×</button>') + '</div>';
}

function projectBody(p) {
  var i = PROJECTS.indexOf(p), next = PROJECTS[(i + 1) % PROJECTS.length];
  var desc = p.desc.map(function (d) {
    if (d[0] === 'order') return '<p class="lead">' + esc(d[1]) + ' →\u00A0<a href="' + d[3] + '" target="_blank" rel="noopener">' + esc(d[2]) + '</a></p>';   // текст → ссылка
    if (d[0] === 'link') return '<a class="read-bar" href="' + d[2] + '" target="_blank" rel="noopener">' +
      '<span>' + esc(d[1]) + '</span></a>';
    return '<p class="' + d[0] + '">' + esc(d[1]).replace(/\{([^}]+)\}/g, '<span class="keep-case">$1</span>') + '</p>';   // {Слово} — без строчных
  }).join('');
  var imgs = p.images.map(function (s0, k) {
    var r = RHYTHM[k % RHYTHM.length];
    return '<img src="' + src(s0) + '" alt="' + esc(p.title) + ' — ' + (k + 1) + ' из ' + p.images.length + '" loading="lazy" style="--c:' + r[0] + ';--s:' + r[1] + '">';
  }).join('');
  return head('', '', false) +
    '<div class="body__grid">' +
      '<div class="body__side t-desc">' +
        '<div class="side__top"><div class="icons"><img src="' + src(p.icons[0]) + '" alt="" loading="lazy"></div>' +
        '<button type="button" class="body__close side__close" data-go="" aria-label="Закрыть, вернуться к me">×</button></div>' +
        '<h2 class="side__title t-name">' + esc(p.title) + '</h2>' +
        '<p class="side__date mute">' + esc(p.foot[0]) + '</p>' +
        desc + '</div>' +
      '<div class="body__flow">' + imgs +
        p.desc.filter(function (d) { return d[0] === 'link'; }).map(function (d) {      // на телефоне кнопка — под последним слайдом
          return '<a class="read-bar read-bar--end" href="' + d[2] + '" target="_blank" rel="noopener"><span>' + esc(d[1]) + '</span></a>';
        }).join('') +
      '</div>' +
    '</div>';
}

// проекты на левой странице раскрытого блокнота: [слева, сверху, ширина] в % страницы
var NB_PROJ = [['9%', '13%', '40%'], ['60%', '7%', '33%'], ['55%', '53%', '35%'], ['12%', '58%', '29%', 'below']];   // 'below' — подпись под картинкой
function nbProjects() {
  return PROJECTS.map(function (p, k) {
    var q = NB_PROJ[k % NB_PROJ.length];
    return '<button type="button" class="nb-proj' + (parseFloat(q[0]) > 40 ? ' nb-proj--right' : '') + (q[3] === 'below' ? ' nb-proj--below' : '') + '" data-go="' + p.id + '" data-hot="' + p.id + '" aria-label="' + p.num + ' ' + esc(p.title) + '" ' +
      'style="--l:' + q[0] + ';--t:' + q[1] + ';--w:' + q[2] + '">' +
      '<span class="nb-proj__label"><span class="nb-proj__num">' + p.num + '</span><span class="nb-proj__title">' + esc(p.title).replace(', ', ',<br>') + '</span></span>' +
      '<img src="' + src(p.icons[0]) + '" alt=""></button>';
  }).join('');
}

function meBody() {
  return head('', '', false) +
    '<div class="body__grid">' +
      '<div class="body__side t-desc">' +
        '<div class="mute dirs"><p>branding<br>content<br>merch</p><p>art direction<br>performance<br>ai</p></div>' +
        '<div class="me__text">' +
        '<p class="lead">мультидисциплинарный дизайнер. делаю айдентику, визуальные системы и концептуальные проекты — от исследования и идеи до готового носителя. открыта к сотрудничеству с брендами, культурными институциями и авторами.</p>' +
        '<div class="me__foot"><p class="mute">hse design<br>alumni 2026</p>' +
        '<p class="mute"><a class="tg-link" href="https://t.me/iamviquzy" target="_blank" rel="noopener"><svg class="tg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.04 15.47 8.67 20.6c.53 0 .76-.23 1.04-.5l2.5-2.39 5.18 3.79c.95.52 1.62.25 1.88-.88l3.4-15.95c.31-1.43-.52-1.99-1.45-1.64L1.22 10.79c-1.37.53-1.35 1.3-.23 1.65l5.13 1.6L18.03 6.6c.56-.37 1.07-.17.65.2"/></svg>@iamviquzy</a></p></div>' +
        '</div>' +
      '</div>' +
      '<div class="stage">' +
        '<div class="nb-scene" role="img" aria-label="Блокнот с фотографиями: вращается, при наведении раскрывается"><div class="nb-wrap"><div class="nb">' +
          '<div class="nb-cover"><i class="f nb-front"></i><i class="f nb-inner">' + nbProjects() + '</i></div>' +
          '<i class="f nb-page"></i><i class="f nb-back"></i>' +
          '<i class="f nb-spine"></i><i class="f nb-edge"></i><i class="f nb-top"></i><i class="f nb-bottom"></i>' +
          '<i class="f nb-strip"></i><i class="f nb-strip-back"></i>' +
          '<a class="f nb-book" href="https://t.me/iamviquzy" target="_blank" rel="noopener" aria-label="Написать мне в телеграм @iamviquzy"></a><i class="f nb-book-back"></i>' +
        '</div></div></div>' +
      '</div>' +
    '</div>';
}

// типографика: короткие слова (предлоги, союзы) не висят в конце строки —
// после них ставится неразрывный пробел
function noHanging(root) {
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  // короткие слова и союзы не висят в конце строки
  var re = /(^|[\s\u00A0(«])([а-яёa-z]{1,2}|что|как|где|или|для|без|при|над|под|про|это|его|её|чтобы|когда|если|который|которые|которая)\s+/gi;
  for (var n = w.nextNode(); n; n = w.nextNode()) {
    n.nodeValue = n.nodeValue.replace(re, '$1$2\u00A0').replace(re, '$1$2\u00A0')
      .replace(/ —/g, '\u00A0—')                          // тире не переносится в начало строки
      .replace(/(\d) (млн|тыс|млрд|%)/g, '$1\u00A0$2')     // число + единица вместе
      .replace(/ ([а-яёa-z\d]{1,4}[.,!?…»]*)$/i, '\u00A0$1');                 // короткое последнее слово не остаётся одно
  }
}

function render(route) {
  strips.classList.add('no-anim');
  requestAnimationFrame(function () { requestAnimationFrame(function () { strips.classList.remove('no-anim'); }); });
  if (!route) route = 'me';                        // главная — это me
  var p = PROJECTS.find(function (x) { return x.id === route; });
  var isMe = route === 'me';
  strips.classList.toggle('is-home', !p && !isMe);
  strips.classList.toggle('has-open', !!p);
  strips.classList.toggle('me-open', isMe);
  page.classList.toggle('view-me', isMe);
  strips.querySelectorAll('.is-hot').forEach(function (el) { el.classList.remove('is-hot'); });
  page.classList.toggle('view-project', !!p);

  strips.querySelectorAll('.strip').forEach(function (el) {
    var id = el.dataset.strip, open = id === route;
    var body = el.querySelector('.strip__body');
    var face = el.querySelector('.strip__face');
    el.classList.toggle('is-open', open);
    if (face) face.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) {
      if (!body.dataset.ready) {                    // картинки грузятся только при открытии
        body.innerHTML = isMe ? meBody() : projectBody(p);
        body.dataset.ready = '1';
      noHanging(body);
      if (isMe && nbObserver) nbObserver.observe(body.querySelector('.stage'));
      if (isMe) nbSetup(body.querySelector('.stage'));
      }
      body.removeAttribute('inert');
      body.scrollTop = 0;
      var flow = body.querySelector('.body__flow');
      if (flow) {
        flow.scrollTop = 0; flow.classList.remove('is-scrolled');
        if (!flow.dataset.watch) {
          flow.dataset.watch = '1';
          var side = body.querySelector('.body__side');
          flow.addEventListener('scroll', function () {
            flow.classList.toggle('is-scrolled', flow.scrollTop > 2);
            // текст стоит на месте; если он не влезает — догоняет плавно вместе с картинками
            if (side && innerWidth >= 700) {
              var fMax = flow.scrollHeight - flow.clientHeight, sMax = side.scrollHeight - side.clientHeight;
              side.scrollTop = sMax > 0 && fMax > 0 ? sMax * flow.scrollTop / fMax : 0;
            }
          }, { passive: true });
          body.addEventListener('wheel', function (e) {
            if (innerWidth < 700 || flow.contains(e.target)) return;
            e.preventDefault();
            flow.scrollTop += e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
          }, { passive: false });
        }
      }
    } else body.setAttribute('inert', '');
  });

  document.title = (p ? p.title + ' — ' : '') + 'viktoria kuzovina — graphic designer';
}

function go(id) {
  if (id) location.hash = id;
  else history.pushState(null, '', location.pathname + location.search), render('');
  if (innerWidth < 700) {
    var target = id ? strips.querySelector('[data-strip="' + id + '"]') : strips;
    setTimeout(function () { target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }, 30);
  }
}

window.addEventListener('hashchange', function () {
  var r = decodeURIComponent(location.hash.slice(1));
  if (r !== 'contact') render(r);
});
window.addEventListener('popstate', function () { render(decodeURIComponent(location.hash.slice(1))); });
(function () { var r = decodeURIComponent(location.hash.slice(1)); render(r === 'contact' ? '' : r); })();

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-go]');
  if (b) go(b.dataset.go);
});
document.getElementById('home').addEventListener('click', function (e) { e.preventDefault(); go(''); });
// раскрытие блокнота: наведение мышью (или нажатие на телефоне)
function nbSetup(stage) {
  var scene = stage.querySelector('.nb-scene'), nb = stage.querySelector('.nb');
  var open = false, timer = null, target = 0;
  function angleNow() {
    var an = nb.getAnimations ? nb.getAnimations()[0] : null;
    if (!an || an.currentTime == null) return 0;
    return (an.currentTime % 16000) / 16000 * 360;
  }
  function doOpen() {
    clearTimeout(stage._later);
    if (open) return; open = true; clearTimeout(timer); stage._inside = false;
    var ang = stage.classList.contains('nb-turning') ? target : angleNow();
    nb.style.animation = 'none'; nb.style.transition = 'none';
    nb.style.transform = 'rotateX(-7deg) rotateY(' + ang + 'deg)';
    nb.offsetWidth;
    target = ang > 180 ? 360 : 0;
    var dur = reduce ? 0 : Math.max(250, Math.abs(target - ang) / 180 * 650);
    nb.style.transition = 'transform ' + dur + 'ms ease';
    nb.style.transform = 'rotateX(0deg) rotateY(' + target + 'deg)';
    stage.classList.add('nb-turning');
    timer = setTimeout(function () { stage.classList.add('nb-open'); }, dur);
  }
  function doClose() {
    clearTimeout(stage._later);
    if (!open) return; open = false; clearTimeout(timer);
    stage.classList.remove('nb-open');
    timer = setTimeout(function () {
      stage.classList.remove('nb-mode-contact');
      nb.style.transition = 'transform .4s ease';
      nb.style.transform = 'rotateX(-7deg) rotateY(' + target + 'deg)';
      timer = setTimeout(function () {
        stage.classList.remove('nb-turning');
        nb.style.transition = ''; nb.style.transform = ''; nb.style.animation = '';
      }, 400);
    }, 900);
  }
  stage._nbOpen = function (mode) {
    stage.classList.toggle('nb-mode-contact', mode === 'contact');
    doOpen();
  };
  stage._nbClose = function () { doClose(); };
  var mouseLike = matchMedia('(hover: hover) and (pointer: fine)').matches;   // на телефоне — только по нажатию
  scene.addEventListener('pointerenter', function (e) { if (mouseLike && e.pointerType === 'mouse' && !open) { stage.classList.remove('nb-mode-contact'); doOpen(); } });
  function closeLater() {
    clearTimeout(stage._later);
    stage._later = setTimeout(doClose, 3000);
  }
  stage.addEventListener('pointerleave', function (e) { if (mouseLike && e.pointerType === 'mouse' && stage._inside) closeLater(); });
  stage.addEventListener('pointermove', function (e) {        // закрыть, когда курсор ушёл с разворота
    if (!mouseLike || !open || e.pointerType !== 'mouse' || !stage.classList.contains('nb-open')) return;
    var b = scene.getBoundingClientRect(), kx = b.width / 751, ky = b.height / 1471;   // область разворота
    var inX = e.clientX > b.left + (310 - 640) * kx && e.clientX < b.left + (310 + 760) * kx;
    var inY = e.clientY > b.top + 70 * ky && e.clientY < b.bottom - 150 * ky;
    if (inX && inY) { stage._inside = true; clearTimeout(stage._later); return; }
    if (stage._inside) closeLater();                           // курсор ушёл с разворота — закрываем через 3 секунды
  });
  // нажатие, а не прокрутка: палец почти не сдвинулся и отпущен быстро
  var tap = null;
  scene.addEventListener('pointerdown', function (e) { tap = { x: e.clientX, y: e.clientY, t: Date.now(), sy: scrollY }; });
  scene.addEventListener('pointercancel', function () { tap = null; });
  scene.addEventListener('click', function (e) {
    if (e.target.closest('[data-go], a')) return;
    if (!mouseLike) {
      if (!tap || Math.abs(e.clientX - tap.x) > 10 || Math.abs(e.clientY - tap.y) > 10 || Math.abs(scrollY - tap.sy) > 5 || Date.now() - tap.t > 500) { tap = null; return; }
      tap = null;
    }
    open ? doClose() : doOpen();
  });
}

function hot(id, on) {
  var strip = strips.querySelector('.strip[data-strip="' + id + '"]');
  var fl = strips.querySelector('.floater[data-hot="' + id + '"]');
  if (strip) strip.classList.toggle('is-hot', on);
  if (fl) fl.classList.toggle('is-hot', on);
  strips.querySelectorAll('.nb-proj[data-hot="' + id + '"]').forEach(function (el) { el.classList.toggle('is-hot', on); });
}
strips.addEventListener('pointerover', function (e) {
  var el = e.target.closest('.floater, .nb-proj, .strips.me-open .strip:not(.is-open)');
  if (el) hot(el.dataset.hot || el.dataset.strip, true);
});
strips.addEventListener('pointerout', function (e) {
  var el = e.target.closest('.floater, .nb-proj, .strip');
  if (el && !el.contains(e.relatedTarget)) hot(el.dataset.hot || el.dataset.strip, false);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && location.hash && location.hash !== '#me') go('');
});
</script>
